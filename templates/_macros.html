{% macro frame(art, query='', room='', size='') -%}
<a class="frame {{ size }}" href="{{ url_for('artwork', slug=art.slug, q=query or None, room=room or None) }}"
   style="--p1: {{ art.palette[0] }}; --p2: {{ art.palette[1] }}; --p3: {{ art.palette[2] }}; --p4: {{ art.palette[3] }};">
  <span class="frame__canvas" style="view-transition-name: art-{{ art.slug }}">
    <img src="{{ art.image }}" alt="{{ art.title }} ({{ art.year }}) by Pablo Picasso" loading="lazy"
         referrerpolicy="no-referrer" onerror="this.closest('.frame').classList.add('is-missing')">
    <span class="frame__fallback" aria-hidden="true"><span></span><span></span><span></span></span>
  </span>
  <span class="label">
    <span class="label__title">{{ art.title }}</span>
    <span class="label__meta">{{ art.year }} · {{ art.museum }}</span>
  </span>
</a>
{%- endmacro %}

{% macro palette(art) -%}
<span class="swatches" aria-label="Colour palette">
  {% for c in art.palette %}<span style="background: {{ c }}" title="{{ c }}"></span>{% endfor %}
</span>
{%- endmacro %}
